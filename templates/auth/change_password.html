{% extends "base.html" %}

{% block title %}Change Password - StockPulse{% endblock %}
{% block page_title %}Security Settings{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="stat-icon bg-info bg-opacity-25 text-info mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h4 class="fw-bold text-white mb-1">Change Password</h4>
                <p class="text-secondary small">Update your account authentication credentials</p>
            </div>

            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="mb-3">
                    <label for="current_password" class="form-label text-secondary small">Current Password</label>
                    <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Current password" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label text-secondary small">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" placeholder="At least 6 characters" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Update Password
                    </button>
                </div>
            </form>

            <div class="text-center">
                <a href="{{ url_for('dashboard.index') }}" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
