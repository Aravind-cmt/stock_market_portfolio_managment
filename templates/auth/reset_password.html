{% extends "base.html" %}

{% block title %}Set New Password - StockPulse{% endblock %}
{% block page_title %}Password Reset Verification{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="stat-icon bg-success bg-opacity-25 text-success mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h4 class="fw-bold text-white">Reset Password</h4>
                <p class="text-secondary small">Set a new secure password for your account</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <div class="mb-3">
                    <label for="new_password" class="form-label text-secondary small">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" placeholder="At least 6 characters" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type new password" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">Set New Password</button>
                </div>
            </form>

            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="text-secondary small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Return to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
