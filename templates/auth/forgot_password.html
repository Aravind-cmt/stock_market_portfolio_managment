{% extends "base.html" %}

{% block title %}Forgot Password - StockPulse{% endblock %}
{% block page_title %}Password Recovery{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="stat-icon bg-warning bg-opacity-25 text-warning mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="bi bi-key"></i>
                </div>
                <h3 class="fw-bold text-white">Reset Password</h3>
                <p class="text-secondary small">Enter your registered email to request a secure recovery token</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="mb-4">
                    <label for="email" class="form-label text-secondary small">Registered Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">
                        <i class="bi bi-send me-2"></i> Send Recovery Token
                    </button>
                </div>
            </form>

            <div class="text-center text-secondary small">
                Remember your password? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
