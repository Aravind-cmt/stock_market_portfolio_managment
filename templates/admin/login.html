{% extends "base.html" %}

{% block title %}Admin Login - StockPulse{% endblock %}
{% block page_title %}Administrator Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card-custom p-4 p-md-5" style="border-color: rgba(234, 179, 8, 0.4);">
            <div class="text-center mb-4">
                <div class="stat-icon bg-warning bg-opacity-25 text-warning mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold text-white">Admin Authentication</h3>
                <p class="text-secondary small">Restricted access — Authorized personnel only</p>
            </div>

            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small">Admin Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-warning"><i class="bi bi-shield"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="admin@stockpulse.com" value="admin@stockpulse.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary small">Admin Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-warning"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Admin@123" value="Admin@123" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-warning py-2 fw-bold text-dark">
                        <i class="bi bi-shield-check me-2"></i> Authenticate as Administrator
                    </button>
                </div>
            </form>

            <div class="text-center">
                <a href="{{ url_for('auth.login') }}" class="text-secondary small text-decoration-none">
                    <i class="bi bi-person me-1"></i> User Login Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
